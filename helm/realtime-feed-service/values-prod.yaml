# 운영 오버라이드. dev 와의 차이만 명시.

springProfile: prod

replicaCount: 3

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: feed.example.com
      paths:
        - path: /api/v1/feed
          pathType: Prefix
        - path: /ws/feed
          pathType: Prefix
  tls:
    - secretName: feed-tls
      hosts:
        - feed.example.com

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true

# Kafka consumer 운영 활성
kafka:
  enabled: true

# 운영 secret 은 chart 밖에서 별도 관리 (SealedSecrets / External Secrets Operator).
postgres:
  password: ""  # 평문 password 비활성 — existingSecret 으로
  existingSecret: feed-postgres
  existingSecretPasswordKey: password
