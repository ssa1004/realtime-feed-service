version: "3.9"

# 통합 환경 — 한 머신에서 한 사이클 (mock JWT → SSE / WebSocket 구독 → mock 거래 이벤트 → 수신).
# 외부 의존을 mock 으로 닫아 다른 portfolio 레포 없이도 본 앱이 자동으로 데모된다.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: feed
      POSTGRES_PASSWORD: feed
      POSTGRES_DB: feed
    ports: ["54322:5432"]   # 다른 portfolio 의 5432 와 충돌 방지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed -d feed"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  redis:
    image: redis:7-alpine
    ports: ["63799:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      # 두 listener 로 분리 — 호스트에서 ./gradlew bootRun 으로 띄운 앱(localhost:9092)과
      # 컨테이너 내부 서비스(kafka:29092)가 둘 다 붙을 수 있게.
      #   EXTERNAL  : 호스트 → localhost:9092  (application.yml 기본값 KAFKA_BOOTSTRAP:localhost:9092 와 일치)
      #   INTERNAL  : 컨테이너 끼리 → kafka:29092 (broker 간 통신도 INTERNAL)
      # 단일 listener(advertised: kafka:9092)면 호스트가 kafka 호스트명을 못 풀어 Reactor Kafka consumer 가 hang/실패한다.
      KAFKA_CFG_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]

  feed:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: feed
      DB_USER: feed
      DB_PASSWORD: feed
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP: kafka:29092   # 컨테이너 끼리는 INTERNAL listener
      OAUTH_JWK_SET_URI: "http://localhost:9999/.well-known/jwks.json"  # dev 우회
    ports: ["8088:8080"]

  # k6 부하 시나리오 — profile=load 일 때만 활성.
  #
  # 컨테이너 안에서는 host 가 "feed:8080" 이지만, scripts/run-load.sh 가 호스트에서
  # localhost:8088 로 실행하는 경로도 지원한다. README 의 'Load test' 절 참고.
  #
  # 띄우는 법:
  #   docker compose -p feed-integration -f infrastructure/docker-compose.yml \
  #       --profile load up k6
  #
  # 한 시나리오만:
  #   docker compose ... --profile load run --rm k6 run /scripts/websocket-fanout.js
  k6:
    image: grafana/k6:0.50.0
    profiles: ["load"]
    depends_on:
      feed: { condition: service_started }
    environment:
      BASE_URL: "http://feed:8080"
      WS_URL: "ws://feed:8080"
      K6_TOKEN: ""
      K6_OUT: ""
    volumes:
      - ../load/k6:/scripts:ro
    # 기본으로는 rest-recent 만 한 번 — 5종 풀세트는 scripts/run-load.sh 에서.
    command: ["run", "/scripts/scenarios/rest-recent.js"]
