name: Realtime Feed Service CI

# 현재 단계에서는 push / PR trigger 를 잠시 OFF 하고 수동 trigger 만 유지합니다.
# 자동 trigger 복원 시 아래 push / pull_request 블록 주석 해제.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   tags: ["v*"]
  # pull_request:
  #   branches: [main]

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write

env:
  JAVA_VERSION: "21"

jobs:
  test:
    name: Build + Unit + Slice tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile (Kotlin only)
        run: ./gradlew --no-daemon compileKotlin compileTestKotlin

      - name: Run unit tests (domain + application + adapters)
        run: |
          ./gradlew --no-daemon \
            :feed-domain:test \
            :feed-application:test \
            :feed-adapter-in:test \
            :feed-adapter-out:test

      - name: Bootstrap context test
        run: ./gradlew --no-daemon :feed-bootstrap:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  helm-lint:
    name: Helm chart lint + template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart (default values)
        run: helm lint helm/realtime-feed-service

      - name: Lint chart (prod values)
        run: helm lint helm/realtime-feed-service --values helm/realtime-feed-service/values-prod.yaml

      - name: Template chart (default values)
        run: helm template helm/realtime-feed-service > /dev/null

      - name: Template chart (prod values)
        run: helm template helm/realtime-feed-service --values helm/realtime-feed-service/values-prod.yaml > /dev/null

  build-image:
    name: Build & push container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, helm-lint]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - name: Determine image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="main-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/realtime-feed-service:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/realtime-feed-service:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
